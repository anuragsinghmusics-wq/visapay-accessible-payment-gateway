name: VisaPay CI / Accessibility & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & WCAG Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=server

      - name: Build Shared Types & Schemas
        run: npm run build:shared

      - name: Typecheck & Build Client
        run: npm run build:client

      - name: Typecheck & Build Server
        run: npm run build:server

      - name: Run Tests & Accessibility Audits
        run: npm test
